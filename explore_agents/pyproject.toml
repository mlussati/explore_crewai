[project]
name = "explore_agents"
version = "0.1.0"
description = "explore_agents using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0"
]

[project.scripts]
explore_agents = "explore_agents.main:run"
run_crew = "explore_agents.main:run"
train = "explore_agents.main:train"
replay = "explore_agents.main:replay"
test = "explore_agents.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
